[package]
name = "bot-host"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Cross-platform native WebRTC, screen capture, input injection, power, and keychain host daemon for opencode-remote-desktop"
license = "MIT"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
bytes = "1.10"
if-addrs = "0.15"
jpeg-encoder = "0.7"
keyring = "4.2"
rand = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
str0m = { version = "0.25", default-features = false, features = ["rust-crypto"] }
tokio = { version = "1.48", features = ["rt-multi-thread", "macros", "io-util", "io-std", "net", "time", "sync", "process", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zeroize = { version = "1.8", features = ["derive"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
openh264 = { version = "0.9", features = ["source"] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-cf = "0.11"
core-foundation = "0.10"
core-graphics = { version = "0.24", features = ["highsierra"] }
screencapturekit = { version = "11.1", features = ["macos_14_0"] }
videotoolbox = { version = "0.21", features = ["compression"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security_Credentials",
    "Win32_System_Com",
    "Win32_System_Power",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.14", default-features = false, features = ["tokio"] }
x11rb = { version = "0.14", features = ["shm", "xtest", "randr"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
