name: publish

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build-host:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            rust_target: aarch64-apple-darwin
            bin_name: bot-host-darwin-arm64
          - runner: macos-latest
            rust_target: x86_64-apple-darwin
            bin_name: bot-host-darwin-x64
          - runner: windows-latest
            rust_target: x86_64-pc-windows-msvc
            bin_name: bot-host-win32-x64.exe
          - runner: windows-latest
            rust_target: aarch64-pc-windows-msvc
            bin_name: bot-host-win32-arm64.exe
          - runner: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
            bin_name: bot-host-linux-x64
          - runner: ubuntu-22.04-arm
            rust_target: aarch64-unknown-linux-gnu
            bin_name: bot-host-linux-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Install nasm for Linux openh264 build
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y nasm

      - name: Build bot-host (${{ matrix.rust_target }})
        env:
          CARGO_BUILD_TARGET: ${{ matrix.rust_target }}
        run: node scripts/build-native.js

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.bin_name }}
          path: dist/bin/${{ matrix.bin_name }}

  publish:
    needs: build-host
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write # OIDC token for npm trusted publishing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1; the bundled one is older.
      - run: npm install -g npm@latest

      - run: npm ci --omit=optional

      - run: npm run typecheck

      - run: npm test

      - uses: actions/download-artifact@v4
        with:
          path: dist/artifacts
          merge-multiple: true

      - name: Prepare per-platform @opencode-bot/host-* packages
        run: node scripts/prepare-host-packages.mjs --from dist/artifacts

      - name: Check that the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(node -p 'require("./package.json").version')"
          if [ "$tag" != "$ver" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json $ver" >&2
            exit 1
          fi

      - name: Publish @opencode-bot/host-* packages
        run: |
          for dir in dist/npm-packages/host-*; do
            name="$(node -p "require('./$dir/package.json').name")"
            ver="$(node -p "require('./$dir/package.json').version")"
            if npm view "$name@$ver" version >/dev/null 2>&1; then
              echo "$name@$ver already published; skipping"
            else
              npm publish "./$dir" --access public --provenance
            fi
          done

      # Publishing a version that is already on the registry fails the run, so skip it:
      # a tag that only marks an existing release should still pass.
      - name: Check whether opencode-remote-desktop is already published
        id: published
        run: |
          ver="$(node -p 'require("./package.json").version')"
          if npm view "opencode-remote-desktop@$ver" version >/dev/null 2>&1; then
            echo "version $ver is already on npm; skipping publish"
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish opencode-remote-desktop to npm
        if: steps.published.outputs.value != 'true'
        run: npm publish --access public --provenance
