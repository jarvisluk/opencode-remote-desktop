name: publish

on:
  workflow_dispatch:
    inputs:
      release_as:
        description: "Version bump override (auto uses Conventional Commits since last v* tag)"
        required: false
        default: auto
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
  push:
    branches:
      - main
    tags:
      - "v*"

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      should_release: ${{ steps.bump.outputs.should_release }}
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve or bump version
        id: bump
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            tag="${GITHUB_REF_NAME}"
            ver="${tag#v}"
            pkg_ver="$(node -p 'require("./package.json").version')"
            if [ "$ver" != "$pkg_ver" ]; then
              echo "tag $tag does not match package.json $pkg_ver" >&2
              exit 1
            fi
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "version=$ver" >> "$GITHUB_OUTPUT"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          release_as="${{ inputs.release_as || 'auto' }}"
          node scripts/bump-version.mjs --as "$release_as"

      - name: Commit & tag bumped version
        if: steps.bump.outputs.should_release == 'true' && !startsWith(github.ref, 'refs/tags/v')
        run: |
          ver="${{ steps.bump.outputs.version }}"
          tag="${{ steps.bump.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json native/bot-host/Cargo.toml native/bot-host/Cargo.lock
          git commit -m "chore(release): $tag"
          git tag "$tag"
          git push origin HEAD:main
          git push origin "$tag"

  build-host:
    needs: version
    if: needs.version.outputs.should_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            rust_target: aarch64-apple-darwin
            bin_name: bot-host-darwin-arm64
          - runner: macos-latest
            rust_target: x86_64-apple-darwin
            bin_name: bot-host-darwin-x64
          - runner: windows-latest
            rust_target: x86_64-pc-windows-msvc
            bin_name: bot-host-win32-x64.exe
          - runner: windows-latest
            rust_target: aarch64-pc-windows-msvc
            bin_name: bot-host-win32-arm64.exe
          - runner: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
            bin_name: bot-host-linux-x64
          - runner: ubuntu-22.04-arm
            rust_target: aarch64-unknown-linux-gnu
            bin_name: bot-host-linux-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Install nasm for Linux openh264 build
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y nasm

      - name: Build bot-host (${{ matrix.rust_target }})
        env:
          CARGO_BUILD_TARGET: ${{ matrix.rust_target }}
        run: node scripts/build-native.js

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.bin_name }}
          path: dist/bin/${{ matrix.bin_name }}

  publish:
    needs: [version, build-host]
    if: needs.version.outputs.should_release == 'true'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write # OIDC token for npm trusted publishing
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1; the bundled one is older.
      - run: npm install -g npm@latest

      - run: npm ci
        env:
          OPENCODE_BOT_SKIP_DOWNLOAD: "1"

      - uses: actions/download-artifact@v4
        with:
          path: dist/release
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        working-directory: dist/release
        run: |
          chmod +x bot-host-darwin-* bot-host-linux-* || true
          sha256sum bot-host-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish binaries to GitHub Release ${{ needs.version.outputs.tag }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ needs.version.outputs.tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/release/* --clobber
          else
            gh release create "$tag" dist/release/* --title "$tag" --generate-notes
          fi

      - name: Stage local Linux host binary for tests
        run: |
          mkdir -p dist/bin
          cp dist/release/bot-host-linux-x64 dist/bin/bot-host-linux-x64
          chmod +x dist/bin/bot-host-linux-x64

      - run: npm run typecheck

      - run: npm test

      - name: Check whether opencode-remote-desktop is already published
        id: published
        run: |
          ver="${{ needs.version.outputs.version }}"
          if npm view "opencode-remote-desktop@$ver" version >/dev/null 2>&1; then
            echo "version $ver is already on npm; skipping publish"
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish opencode-remote-desktop to npm
        if: steps.published.outputs.value != 'true'
        run: npm publish --access public --provenance
