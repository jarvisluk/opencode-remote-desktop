name: publish

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    # macOS runner: the package ships darwin-arm64 sidecars, and the capture backend needs swiftc.
    runs-on: macos-latest
    permissions:
      contents: read
      id-token: write # OIDC token for npm trusted publishing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      # Trusted publishing needs npm >= 11.5.1; the bundled one is older.
      - run: npm install -g npm@latest

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - name: Build native sidecars
        run: npm run build:native

      - name: Check that the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(node -p 'require("./package.json").version')"
          if [ "$tag" != "$ver" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json $ver" >&2
            exit 1
          fi

      # Publishing a version that is already on the registry fails the run, so skip it:
      # a tag that only marks an existing release should still pass.
      - name: Check whether this version is already published
        id: published
        run: |
          ver="$(node -p 'require("./package.json").version')"
          if npm view "opencode-remote-desktop@$ver" version >/dev/null 2>&1; then
            echo "version $ver is already on npm; skipping publish"
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.published.outputs.value != 'true'
        run: npm publish --access public --provenance
